name: life_dashboard
description: A productivity dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.2
  intl: ^0.19.0
  
  # Core Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  http: ^1.6.0
  #intl: ^0.18.1
  uuid: ^4.5.2           # NEW: For unique IDs (Journal/Chat)
  
  # UI & Fonts
  google_fonts: ^6.1.0
  
  # Audio
  audioplayers: ^6.0.0   # NEW: For the Zen Timer Gong
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_animate: ^4.5.2
  flutter_heatmap_calendar: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # NEW: Asset Registration
  assets:
    - assets/sounds/
    - assets/images/

